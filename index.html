<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測驗練習應用程式 - 支援多重佈景</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/papaparse@5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen p-4 transition-colors duration-300">

<div id="app" class="container mx-auto p-8 rounded-2xl shadow-xl bg-card my-8 relative transition-colors duration-300">
    <h1 class="text-3xl font-bold text-center mb-6" style="color: var(--theme-text)">測驗練習應用程式</h1>

    <div id="settings-page" class="space-y-6">
        <div>
            <label for="file-input" class="block font-medium mb-2 theme-text-muted">上傳您的題庫檔案 (CSV 或 XLSX)</label>
            <input type="file" id="file-input" multiple accept=".csv, .xlsx" class="w-full theme-bg-input rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 theme-border border" style="color: var(--theme-text)">
        </div>

        <div>
            <label class="block font-medium mb-2 theme-text-muted">1. 選擇模式</label>
            <div class="flex flex-col space-y-3">
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="test-mode" value="exam" checked class="form-radio text-blue-600 w-4 h-4">
                    <span class="ml-2 font-medium">測驗模式 <span class="text-sm font-normal theme-text-muted">(全部作答完看結果)</span></span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="test-mode" value="practice" class="form-radio text-blue-600 w-4 h-4">
                    <span class="ml-2 font-medium">練習模式 <span class="text-sm font-normal theme-text-muted">(每題作答後即時看對錯與詳解)</span></span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="test-mode" value="read" class="form-radio text-purple-600 w-4 h-4">
                    <span class="ml-2 font-medium">讀題模式 <span class="text-sm font-normal theme-text-muted">(單純瀏覽題庫，直接顯示正確答案與詳解)</span></span>
                </label>
            </div>
        </div>

        <div>
            <label class="block font-medium mb-2 theme-text-muted">2. 選擇科目</label>
            <div class="mb-3 flex flex-col space-y-2 md:flex-row md:space-y-0 md:space-x-4">
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="subject-mode" value="single" checked class="form-radio text-blue-600 w-4 h-4">
                    <span class="ml-2 font-medium">單一科目</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="subject-mode" value="multiple" class="form-radio text-blue-600 w-4 h-4">
                    <span class="ml-2 font-medium">多科目合併 <span class="text-sm font-normal theme-text-muted">(自訂比例)</span></span>
                </label>
            </div>

            <div id="single-subject-container">
                <select id="subject-select" class="w-full theme-bg-input theme-border border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" style="color: var(--theme-text)">
                    <option value="">請先上傳檔案</option>
                </select>
            </div>

            <div id="multi-subject-container" class="hidden p-4 rounded-lg theme-border border shadow-sm mt-2 bg-card">
                <div class="flex justify-between items-center mb-3">
                    <span class="font-medium text-sm theme-text-muted">勾選要合併的科目並設定比例：</span>
                    <button id="even-distribute-btn" class="text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded hover:bg-blue-200 transition">平分比例</button>
                </div>
                <div id="multi-subject-list" class="space-y-2 max-h-48 overflow-y-auto mb-3 pr-2"></div>
                <div class="text-right font-medium text-sm pt-2 theme-border border-t">
                    目前總比例：<span id="total-ratio" class="text-red-500">0</span>%
                </div>
            </div>
        </div>

        <div>
            <label class="block font-medium mb-2 theme-text-muted">3. 選擇題目類型</label>
            <div class="flex space-x-4">
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="question-type" value="是非題" checked class="form-radio text-blue-600 w-4 h-4">
                    <span class="ml-2">是非題</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="question-type" value="選擇題" class="form-radio text-blue-600 w-4 h-4">
                    <span class="ml-2">選擇題</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="question-type" value="混合" class="form-radio text-blue-600 w-4 h-4">
                    <span class="ml-2">混合</span>
                </label>
            </div>

            <div id="answer-filter-section" class="mt-3 p-4 rounded-lg theme-border border hidden" style="background-color: var(--theme-info-bg)">
                <label class="block font-bold mb-3 text-sm" style="color: var(--theme-info-text)">進階篩選：只看特定答案的題目 (若全不勾選則代表全考)</label>
                <div id="filter-tf-group" class="flex space-x-4 hidden">
                    <label class="flex items-center cursor-pointer px-4 py-2 rounded-full theme-border border shadow-sm bg-card">
                        <input type="checkbox" id="filter-tf-o" class="form-checkbox text-blue-600 w-4 h-4 rounded">
                        <span class="ml-2 text-sm font-medium">答案為「是 (O)」</span>
                    </label>
                    <label class="flex items-center cursor-pointer px-4 py-2 rounded-full theme-border border shadow-sm bg-card">
                        <input type="checkbox" id="filter-tf-x" class="form-checkbox text-blue-600 w-4 h-4 rounded">
                        <span class="ml-2 text-sm font-medium">答案為「否 (X)」</span>
                    </label>
                </div>
                <div id="filter-mc-group" class="hidden flex flex-wrap gap-3"></div>
            </div>
        </div>

        <div>
            <label class="block font-medium mb-2 theme-text-muted">4. 選擇範圍</label>
            <div class="flex flex-col space-y-4 md:flex-row md:space-y-0 md:space-x-4">
                <div class="flex-1">
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="exam-scope" value="all" checked class="form-radio text-blue-600 w-4 h-4">
                        <span class="ml-2">全題庫</span>
                    </label>
                </div>
                <div class="flex-1">
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="exam-scope" value="random" class="form-radio text-blue-600 w-4 h-4">
                        <span class="ml-2">指定數量</span>
                    </label>
                    <input type="number" id="question-count" placeholder="輸入題數" class="w-full theme-bg-input theme-border border rounded-lg p-2 mt-2 focus:outline-none focus:ring-2 focus:ring-blue-500" min="1" disabled style="color: var(--theme-text)">
                </div>
                <div class="flex-1">
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="exam-scope" value="range" class="form-radio text-blue-600 w-4 h-4">
                        <span class="ml-2">指定範圍</span>
                    </label>
                    <div class="flex space-x-2 mt-2">
                        <input type="number" id="start-number" placeholder="起始題號" class="w-1/2 theme-bg-input theme-border border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" min="1" disabled style="color: var(--theme-text)">
                        <input type="number" id="end-number" placeholder="結束題號" class="w-1/2 theme-bg-input theme-border border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" min="1" disabled style="color: var(--theme-text)">
                    </div>
                </div>
            </div>
        </div>

        <div id="setting-exam-time">
            <label for="exam-time" class="block font-medium mb-2 theme-text-muted">5. 輸入考試時間 (分鐘)</label>
            <input type="number" id="exam-time" placeholder="無時間限制" class="w-full theme-bg-input theme-border border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" min="0" style="color: var(--theme-text)">
        </div>

        <div id="setting-pass-rate">
            <label for="pass-rate" class="block font-medium mb-2 theme-text-muted">6. 輸入通過率 (%)</label>
            <input type="number" id="pass-rate" value="60" class="w-full theme-bg-input theme-border border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" min="0" max="100" style="color: var(--theme-text)">
        </div>

        <div id="setting-direct-review">
            <label class="flex items-center cursor-pointer">
                <input type="checkbox" id="direct-review" class="form-checkbox h-5 w-5 text-blue-600 rounded focus:ring-blue-500">
                <span class="ml-2 font-medium theme-text-muted">7. 測驗結束後直接檢討試卷</span>
            </label>
        </div>

        <div id="error-message" class="text-red-500 text-center font-medium hidden"></div>

        <button id="start-exam-btn" class="w-full btn-primary py-3 text-lg mt-4">開始</button>
    </div>

    <button id="status-overview-btn" class="hidden absolute top-4 right-4 z-20 btn-secondary text-xs sm:text-sm px-3 py-2">📋 作答總覽</button>

    <div id="exam-page" class="hidden">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold" id="exam-title"></h2>
            <div id="timer" class="text-2xl font-semibold theme-text-muted"></div>
        </div>

        <div class="px-4 py-3 rounded-lg mb-4 font-medium hidden border" id="practice-mode-indicator" style="background-color: var(--theme-info-bg); color: var(--theme-info-text); border-color: var(--theme-info-border);">
            🛠️ 練習模式：作答後請點擊下方「確認答案」查看結果。
        </div>

        <div class="px-4 py-3 rounded-lg mb-4 font-medium hidden border" id="read-mode-indicator" style="background-color: var(--theme-info-bg); color: var(--theme-info-text); border-color: var(--theme-info-border);">
            📖 讀題模式：直接瀏覽題庫與正確答案。
        </div>

        <div id="question-area" class="space-y-6">
            <div class="theme-bg-alt p-6 rounded-xl theme-border border shadow-sm transition-colors duration-300">
                <p class="text-lg font-semibold mb-4" id="question-text"></p>
                <div id="options-container" class="space-y-3"></div>

                <div id="confidence-section" class="hidden flex items-center flex-wrap gap-2 mt-4 pt-4 theme-border border-t">
                    <span class="text-sm font-medium mr-1 theme-text-muted">信心標記：</span>
                    <button type="button" id="confidence-unsure-btn" class="confidence-btn px-3 py-1 rounded-full theme-border border text-sm bg-card transition">❓ 不確定</button>
                    <button type="button" id="confidence-confident-btn" class="confidence-btn px-3 py-1 rounded-full theme-border border text-sm bg-card transition">✅ 有把握</button>
                </div>
            </div>

            <div id="practice-feedback" class="hidden p-5 rounded-xl mt-4 transition-colors duration-300"></div>

            <div class="flex justify-between mt-6">
                <button id="prev-btn" class="btn-secondary hidden py-2 px-6">&lt; 上一題</button>
                <button id="confirm-btn" class="btn-primary ml-auto hidden py-2 px-6">確認答案</button>
                <button id="next-btn" class="btn-primary ml-auto py-2 px-6">下一題 &gt;</button>
            </div>
        </div>
    </div>

    <div id="results-page" class="hidden text-center space-y-6 py-8">
        <h2 class="text-4xl font-bold">完成</h2>
        <div id="results-summary" class="text-2xl font-medium theme-text-muted"></div>
        <div id="pass-fail-message" class="text-3xl font-bold"></div>
        <div class="flex justify-center flex-wrap gap-4 mt-8">
            <button id="review-exam-btn" class="btn-secondary py-3 px-6">檢討試卷</button>
            <button id="retry-wrong-btn" class="hidden btn-secondary py-3 px-6">🔁 錯題重考</button>
            <button id="restart-btn" class="btn-primary py-3 px-6">重新開始</button>
        </div>
    </div>

    <div id="review-page" class="hidden">
        <h2 class="text-3xl font-bold text-center mb-6">試卷檢討</h2>
        <div id="review-questions" class="space-y-8"></div>
        <button id="back-to-results-btn" class="w-full btn-secondary mt-8 py-3">返回結果</button>
    </div>
</div>

<div id="status-overview-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4 transition-opacity">
    <div class="bg-card rounded-2xl shadow-xl max-w-2xl w-full max-h-[80vh] overflow-y-auto p-6 relative theme-border border">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold">作答狀態總覽</h3>
            <button id="close-status-overview-btn" class="theme-text-muted hover:opacity-70 text-2xl leading-none">&times;</button>
        </div>
        <div id="status-overview-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2"></div>
    </div>
</div>

<div class="theme-fab" id="open-theme-modal" title="外觀與主題設定">🎨</div>

<div id="theme-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4">
    <div class="bg-card rounded-2xl shadow-xl w-full max-w-md p-6 relative theme-border border transition-colors duration-300">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold">外觀與主題設定</h3>
            <button id="close-theme-modal" class="theme-text-muted hover:opacity-70 text-2xl leading-none">&times;</button>
        </div>

        <div class="space-y-6">
            <div>
                <p class="font-medium mb-3 theme-text-muted">快速套用佈景</p>
                <div class="grid grid-cols-2 gap-3">
                    <button class="theme-btn border rounded py-2 px-4 font-medium transition hover:opacity-80" data-set-theme="default" style="background-color: #f3f4f6; color: #1f2937; border-color: #e5e7eb;">預設 (明亮)</button>
                    <button class="theme-btn border rounded py-2 px-4 font-medium transition hover:opacity-80" data-set-theme="dark" style="background-color: #111827; color: #f9fafb; border-color: #4b5563;">暗黑模式</button>
                    <button class="theme-btn border rounded py-2 px-4 font-medium transition hover:opacity-80" data-set-theme="hc" style="background-color: #000000; color: #ffff00; border-color: #ffff00;">高對比模式</button>
                    <button class="theme-btn border rounded py-2 px-4 font-medium transition hover:opacity-80" data-set-theme="eye" style="background-color: #c7edcc; color: #222222; border-color: #a3c9a8;">護眼模式</button>
                </div>
            </div>

            <hr class="theme-border">

            <div>
                <p class="font-medium mb-3 theme-text-muted">字體大小</p>
                <div class="flex items-center space-x-3">
                    <span class="text-xs theme-text-muted">A</span>
                    <input type="range" id="font-size-slider" min="80" max="150" step="5" value="100" class="flex-1">
                    <span class="text-xl theme-text-muted">A</span>
                </div>
                <div class="text-center text-sm theme-text-muted mt-1"><span id="font-size-value">100</span>%</div>
            </div>

            <hr class="theme-border">

            <div>
                <p class="font-medium mb-3 theme-text-muted">自訂專屬顏色</p>
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <label>背景顏色 (Background)</label>
                        <input type="color" id="custom-bg" class="w-10 h-10 rounded cursor-pointer">
                    </div>
                    <div class="flex items-center justify-between">
                        <label>卡片顏色 (Card)</label>
                        <input type="color" id="custom-card" class="w-10 h-10 rounded cursor-pointer">
                    </div>
                    <div class="flex items-center justify-between">
                        <label>文字顏色 (Text)</label>
                        <input type="color" id="custom-text" class="w-10 h-10 rounded cursor-pointer">
                    </div>
                </div>
                <div class="mt-4 flex space-x-3">
                    <button id="apply-custom-btn" class="flex-1 btn-primary py-2 text-sm">套用自訂顏色</button>
                    <button id="reset-theme-btn" class="flex-1 btn-secondary py-2 text-sm">清除自訂</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
